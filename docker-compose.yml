version: '3.8'

services:
  api:
    build: .
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ecommerce_api
      JWT_SECRET: ${JWT_SECRET:-replace_this_with_a_long_random_secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
    depends_on:
      - mongo
    volumes:
      - ./logs:/usr/src/app/logs

  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: |
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  mongo_data:
